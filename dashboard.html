<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Vexorion</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .dashboard-container {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .dashboard-header {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
            flex-wrap: wrap;
            gap: 16px;
        }

        .dashboard-header h1 {
            font-size: 24px;
            color: #f5c842;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            color: #999;
            font-size: 14px;
        }

        .user-info strong {
            color: #f5c842;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #e50914;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #b20710;
        }

        .content {
            max-width: 1200px;
            margin: 40px auto;
        }

        .content h2 {
            margin-bottom: 20px;
            color: #f5c842;
            font-size: 20px;
        }

        .stream-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .stream-card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2a2a2a;
            transition: all 0.3s ease;
            cursor: default;
        }

        .stream-card:hover {
            border-color: #f5c842;
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(245, 200, 66, 0.1);
        }

        .stream-title {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .live-badge {
            display: inline-block;
            padding: 2px 10px;
            background: #e50914;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stream-meta {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .stream-meta .category {
            display: inline-block;
            padding: 2px 10px;
            background: #2a2a2a;
            border-radius: 12px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e50914;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .dashboard-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .stream-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container" id="app">
        <header class="dashboard-header">
            <h1>🎬 Vexorion Dashboard</h1>
            <div class="header-actions">
                <span class="user-info" id="userInfo">Welcome, <strong>User</strong></span>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </header>
        <main class="content">
            <h2>Live Streams</h2>
            <div id="streamsContainer">
                <div class="loading">Loading streams...</div>
            </div>
        </main>
    </div>

    <script type="module">
        import { authManager, toastManager } from './src/Vexor.js';
        import { apiService } from './src/js/modules/ApiService.js';

        // --- Auth Check ---
        if (!authManager.isAuthenticated()) {
            window.location.href = '/';
        }

        // --- User Info ---
        const user = authManager.getUser();
        if (user) {
            document.getElementById('userInfo').innerHTML = 
                `Welcome, <strong>${user.name || user.email}</strong>`;
            toastManager.success(`Welcome to Dashboard, ${user.name || user.email}!`);
        }

        // --- Logout ---
        document.getElementById('logoutBtn').addEventListener('click', () => {
            authManager.logout();
        });

        // --- Load Streams ---
        async function loadStreams() {
            const container = document.getElementById('streamsContainer');
            
            try {
                const streams = await apiService.getStreams();
                
                if (!streams || streams.length === 0) {
                    container.innerHTML = `<div class="loading">No streams available</div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="stream-grid">
                        ${streams.map(stream => `
                            <div class="stream-card">
                                <div class="stream-title">
                                    ${stream.title}
                                    ${stream.is_live ? '<span class="live-badge">● LIVE</span>' : ''}
                                </div>
                                <div class="stream-meta">
                                    <div>🎮 ${stream.streamer}</div>
                                    <div>👁️ ${(stream.viewers || 0).toLocaleString()} viewers</div>
                                    <div>📺 ${stream.quality || 'HD'} · <span class="category">${stream.category || 'General'}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('[Dashboard] Load streams error:', error);
                container.innerHTML = `
                    <div class="error">
                        ❌ Failed to load streams: ${error.message}
                        <br><br>
                        <button onclick="location.reload()" style="padding:8px 20px;background:#f5c842;border:none;border-radius:4px;color:#000;cursor:pointer;font-weight:bold;">
                            Retry
                        </button>
                    </div>
                `;
                toastManager.error('Failed to load streams');
            }
        }

        loadStreams();

        // --- Auto-refresh every 30 seconds ---
        let refreshInterval = setInterval(() => {
            if (document.hidden) return;
            loadStreams();
        }, 30000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
        });

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                loadStreams();
                toastManager.info('Refreshing streams...');
            }
        });
    </script>
</body>
</html>
