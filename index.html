<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexorion · Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Style login */
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .login-container {
            background: #151515;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            max-width: 400px;
            width: 100%;
        }
        .login-container h1 {
            color: #f5c842;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .login-container .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #ccc;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f5c842;
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            font-size: 13px;
        }
        .remember-forgot label {
            color: #999;
            cursor: pointer;
        }
        .remember-forgot a {
            color: #f5c842;
            text-decoration: none;
        }
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #f5c842;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
        .signup-link a {
            color: #f5c842;
            text-decoration: none;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .demo-hint {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 12px;
            border-top: 1px solid #2a2a2a;
            padding-top: 16px;
        }
        .demo-hint kbd {
            background: #1a1a1a;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #333;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h1>🎬 Vexorion</h1>
        <div class="subtitle">Sign in to your account</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="emailInput">Email address</label>
                <input type="email" id="emailInput" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberCheck"> Remember me
                </label>
                <a href="#" id="forgotLink">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-primary" id="signinBtn">Sign in</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="#" id="signupLink">Create one</a>
        </div>
        
        <div class="demo-hint">
            Press <kbd>Ctrl</kbd> + <kbd>D</kbd> to load demo credentials
        </div>
    </div>

    <script type="module" src="src/Vexor.js"></script>
</body>
</html>
