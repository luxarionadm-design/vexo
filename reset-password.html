<!DOCTYPE html>
<html>
<head>
    <title>Reset Password · Vexorion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="max-width:400px;margin:100px auto;text-align:center;padding:40px;background:#151515;border-radius:12px;border:1px solid #2a2a2a;">
        <h1 style="color:#f5c842;">🔐 Reset Password</h1>
        <p style="color:#999;margin:20px 0;">Enter your new password below.</p>
        <input type="password" id="newPassword" placeholder="New password" style="width:100%;padding:12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;color:#fff;margin-bottom:12px;">
        <input type="password" id="confirmPassword" placeholder="Confirm password" style="width:100%;padding:12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;color:#fff;margin-bottom:16px;">
        <button onclick="updatePassword()" style="width:100%;padding:14px;background:#f5c842;border:none;border-radius:4px;color:#000;font-weight:bold;cursor:pointer;">Update Password</button>
    </div>
    <script>
        async function updatePassword() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }
            try {
                const { supabase } = await import('./src/js/config/supabase.js');
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;
                alert('Password updated successfully! Redirecting to login...');
                window.location.href = '/';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
