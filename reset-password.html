<!DOCTYPE html>
<html>
<head>
    <title>Reset Password · Vexorion</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tambahan style untuk mobile */
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .reset-container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px;
            background: #151515;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }
        .reset-container h1 {
            color: #f5c842;
            margin-bottom: 8px;
        }
        .reset-container .subtitle {
            color: #999;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .reset-container input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .reset-container input:focus {
            outline: none;
            border-color: #f5c842;
        }
        .reset-container .btn-primary {
            width: 100%;
            padding: 14px;
            background: #f5c842;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .reset-container .btn-primary:hover {
            opacity: 0.9;
        }
        .reset-container .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .reset-container .back-link {
            display: block;
            margin-top: 16px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
        .reset-container .back-link:hover {
            color: #f5c842;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            border-left: 4px solid #f5c842;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 9999;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .toast-message.error {
            border-left-color: #e50914;
        }
        .toast-message.success {
            border-left-color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h1>🔐 Reset Password</h1>
        <p class="subtitle">Enter your new password below.</p>
        
        <input type="password" id="newPassword" placeholder="New password (min 6 characters)" autofocus>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
        
        <button class="btn-primary" id="updateBtn" onclick="updatePassword()">Update Password</button>
        
        <a href="/" class="back-link">← Back to Login</a>
    </div>

    <!-- Toast untuk notifikasi -->
    <div id="toast" class="toast-message"></div>

    <script>
        // Toast helper
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast-message';
            if (type) toast.classList.add(type);
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        async function updatePassword() {
            const btn = document.getElementById('updateBtn');
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            // Validation
            if (!password || password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                document.getElementById('newPassword').focus();
                return;
            }

            if (password !== confirm) {
                showToast('Passwords do not match!', 'error');
                document.getElementById('confirmPassword').focus();
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                // Dynamic import Supabase
                const { supabase } = await import('./src/js/config/supabase.js');
                
                const { data, error } = await supabase.auth.updateUser({ 
                    password: password 
                });

                if (error) throw error;

                showToast('✅ Password updated successfully!', 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                console.error('[ResetPassword] Error:', error);
                showToast('❌ Error: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'newPassword' || active.id === 'confirmPassword') {
                    e.preventDefault();
                    updatePassword();
                }
            }
        });

        // Check if we have a session (user came from reset email)
        async function checkSession() {
            try {
                const { supabase } = await import('./src/js/config/supabase.js');
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.warn('[ResetPassword] No valid session:', error);
                    showToast('Please use the link from your email to reset password', 'error');
                    return;
                }

                if (data.session) {
                    console.log('[ResetPassword] Session found, user can reset password');
                } else {
                    showToast('Please use the link from your email to reset password', 'error');
                }
            } catch (error) {
                console.warn('[ResetPassword] Session check failed:', error);
            }
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
